
server {
    listen 80;
    server_name huntorharvest.com www.huntorharvest.com exchange.huntorharvest.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name huntorharvest.com www.huntorharvest.com exchange.huntorharvest.com;

    ssl_certificate /etc/letsencrypt/live/huntorharvest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huntorharvest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/huntorharvest;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
