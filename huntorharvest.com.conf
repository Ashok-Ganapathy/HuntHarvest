# Not yet enabled - DNS still points at the dead old droplet. Deploy this once
# Cloudflare's A records are updated to 142.93.196.178 and SSL is issued.
server {
    listen 80;
    server_name huntorharvest.com www.huntorharvest.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name huntorharvest.com www.huntorharvest.com;
    ssl_certificate /etc/letsencrypt/live/huntorharvest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huntorharvest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
